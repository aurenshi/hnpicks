<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SITE_TITLE}}</title>
<meta name="description" content="从 Hacker News、Lobsters、Reddit 多年的讨论里，筛出被多位用户、跨越多个月份反复推荐的视频。无需登录，偏好只保存在你的浏览器里。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff6a00'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#ffffff; --bg2:#f2f2f2; --bg3:#e5e5e5; --ink:#0f0f0f; --muted:#606060; --line:#e5e5e5;
  --accent:#ff6a00; --overlay:rgba(0,0,0,.8); --card-hover:#f2f2f2; --shadow:0 4px 24px rgba(0,0,0,.12);
}
:root[data-theme="dark"]{
  --bg:#0f0f0f; --bg2:#272727; --bg3:#3f3f3f; --ink:#f1f1f1; --muted:#aaaaaa; --line:#303030;
  --card-hover:#1f1f1f; --shadow:0 4px 24px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f0f; --bg2:#272727; --bg3:#3f3f3f; --ink:#f1f1f1; --muted:#aaaaaa; --line:#303030;
    --card-hover:#1f1f1f; --shadow:0 4px 24px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.45 Roboto,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* ---------- 顶栏 ---------- */
.top{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg);z-index:30}
.iconbtn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--bg2)}
.logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:19px;letter-spacing:-.4px;padding:0 8px 0 4px;white-space:nowrap}
.logo .mark{width:28px;height:20px;border-radius:5px;background:var(--accent);display:grid;place-items:center}
.logo .mark::after{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.logo b{color:var(--accent)}
.search{flex:0 1 640px;min-width:0;margin:0 auto;display:flex;height:40px}
.search input{flex:1;min-width:0;border:1px solid var(--bg3);border-right:0;border-radius:20px 0 0 20px;padding:0 16px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);outline:none}
.search input:focus{border-color:#1c62b9}
.search button{width:64px;border:1px solid var(--bg3);border-radius:0 20px 20px 0;background:var(--bg2);cursor:pointer;display:grid;place-items:center}
.right{display:flex;gap:4px}

/* ---------- 侧栏 ---------- */
.side{position:fixed;top:56px;bottom:0;left:0;width:228px;padding:4px 12px 24px;overflow-y:auto;background:var(--bg);z-index:25;scrollbar-width:thin}
.side a{display:flex;align-items:center;gap:22px;height:40px;padding:0 12px;border-radius:10px;font-size:14.5px}
.side a:hover{background:var(--bg2)}
.side a.on{background:var(--bg2);font-weight:600}
.side hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.side .small{color:var(--muted);font-size:12px;padding:8px 12px;line-height:1.6}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:24}
main{margin-left:228px;padding:56px 24px 40px;min-height:100vh}
body.collapsed .side{display:none} body.collapsed main{margin-left:0}

/* ---------- 筛选与分类条 ---------- */
.bar{position:sticky;top:56px;background:var(--bg);z-index:10;display:flex;gap:12px;align-items:center;padding:12px 0}
.chips{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:8px;background:var(--bg2);padding:6px 12px;white-space:nowrap;cursor:pointer;font-size:14px;font-weight:500}
.chip:hover{background:var(--bg3)}
.chip.on{background:var(--ink);color:var(--bg)}
.fbtn{display:flex;align-items:center;gap:8px;border:0;border-radius:18px;background:var(--bg2);padding:7px 14px;cursor:pointer;font-weight:500;flex:none}
.fbtn:hover{background:var(--bg3)}
.fbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.panel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px 24px;padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:8px}
.panel h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.panel button{display:block;border:0;background:none;padding:6px 0;cursor:pointer;color:var(--muted);text-align:left}
.panel button.on{color:var(--ink);font-weight:600}
.panel button:disabled{opacity:.4;cursor:not-allowed}
.panel .note{font-size:12px;color:var(--muted);grid-column:1/-1}
.pagehead{display:flex;align-items:baseline;gap:12px;margin:20px 0 4px}
.pagehead h2{font-size:22px;margin:0}
.pagehead span{color:var(--muted)}
.pagehead button{margin-left:auto}
.ghost{border:0;background:var(--bg2);border-radius:18px;padding:7px 14px;cursor:pointer}
.ghost:hover{background:var(--bg3)}

/* ---------- 视频卡片 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 16px;padding-top:8px}
.vc{display:flex;flex-direction:column;gap:12px;min-width:0}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg2);display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s;color:transparent}
.vc:hover .th img{transform:scale(1.02)}
.dur{position:absolute;right:8px;bottom:8px;background:var(--overlay);color:#fff;font-size:12px;font-weight:600;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.seenbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent)}
.tw{position:absolute;inset:0;padding:16px 18px;background:#15202b;color:#e7e9ea;font-size:14px;line-height:1.5;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.tw .xl{font-weight:800;font-size:18px}
.tw p{margin:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.vt{font-size:16px;font-weight:600;line-height:22px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm{color:var(--muted);font-size:14px;line-height:20px;margin-top:4px}
.vm .hn{color:var(--accent);font-weight:500}
.sentinel{height:1px}
.empty{color:var(--muted);text-align:center;padding:80px 0;font-size:15px}
.banner{background:var(--bg2);border-radius:12px;padding:12px 16px;margin:16px 0 0;color:var(--muted);font-size:13px}
.banner b{color:var(--ink)}

/* ---------- 播放页 ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 402px;gap:24px;padding-top:24px;max-width:1750px}
.player{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
.player .poster{position:absolute;inset:0;display:grid;place-items:center;background:#000 center/cover no-repeat;color:#fff}
.player .poster span{background:var(--overlay);padding:10px 18px;border-radius:24px;font-weight:600;display:flex;gap:8px;align-items:center}
.player .tw{font-size:20px;padding:32px}
.player .tw p{-webkit-line-clamp:12}
.wt{font-size:20px;font-weight:700;line-height:28px;margin:12px 0 2px}
.wo{color:var(--muted);font-size:13px;margin:0 0 8px}
.wrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:8px 0 12px}
.wch{font-weight:600;font-size:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;border:0;border-radius:18px;background:var(--bg2);padding:0 14px;cursor:pointer;font-weight:500;font-size:14px}
.pill:hover{background:var(--bg3)}
.pill.on{background:var(--ink);color:var(--bg)}
.pill svg.i{width:20px;height:20px}
.desc{background:var(--bg2);border-radius:12px;padding:12px;font-size:14px}
.desc .st{font-weight:600}
.desc p{margin:8px 0 0;white-space:pre-line}
.desc .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.desc .tags a{color:#3ea6ff}
:root:not([data-theme="dark"]) .desc .tags a{color:#065fd4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .desc .tags a{color:#3ea6ff}}
.quotes h3{font-size:18px;margin:24px 0 12px}
.qt{display:flex;gap:12px;margin-bottom:18px}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.qt .who{font-size:13px;font-weight:600}
.qt .who span{color:var(--muted);font-weight:400;margin-left:6px}
.qt .who span.sb{font-size:11px;background:var(--bg2);border-radius:4px;padding:1px 6px}
.qt .who a:hover{text-decoration:underline}
.qt p{margin:3px 0 0;font-size:14px;line-height:20px;word-break:break-word}
.rel{display:flex;flex-direction:column;gap:8px}
.rel h3{font-size:16px;margin:0 0 4px}
.rc{display:grid;grid-template-columns:168px minmax(0,1fr);gap:8px}
.rc .th{border-radius:8px}
.rc .dur{font-size:11px;right:4px;bottom:4px}
.rc .vt{font-size:14px;line-height:20px}
.rc .vm{font-size:12px;line-height:18px;margin-top:2px}

/* ---------- 分类页 / 设置 ---------- */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.cat{background:var(--bg2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.cat:hover{background:var(--bg3)}
.cat b{font-size:16px}
.cat span{color:var(--muted);font-size:13px}
.cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cloud a{background:var(--bg2);border-radius:8px;padding:5px 10px;font-size:13.5px}
.cloud a:hover{background:var(--bg3)}
.cloud small{color:var(--muted);margin-left:4px}
.set{max-width:720px}
.set section{border-bottom:1px solid var(--line);padding:18px 0}
.set h3{margin:0 0 4px;font-size:16px}
.set p{margin:0 0 10px;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 18px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* ---------- 弹窗 / 提示 ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--bg);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px 24px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 10px;font-size:20px}
.modal p{color:var(--muted);margin:8px 0}
.modal table{border-collapse:collapse;width:100%;margin-top:6px}
.modal td{padding:5px 0;border-bottom:1px solid var(--line)}
kbd{background:var(--bg2);border:1px solid var(--bg3);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font:12px ui-monospace,Menlo,monospace}
.toast{position:fixed;left:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:8px;z-index:60;box-shadow:var(--shadow)}

/* ---------- 响应式 ---------- */
@media (max-width:1300px){ .watch{grid-template-columns:minmax(0,1fr) 340px} .rc{grid-template-columns:140px minmax(0,1fr)} }
@media (max-width:1100px){
  .side{display:none;box-shadow:var(--shadow)} body.drawer .side{display:block}
  main{margin-left:0} .watch{grid-template-columns:1fr}
  .panel{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .top{padding:0 8px;gap:4px} .logo span.word{display:none}
  .search{flex:1 1 auto} .search input{padding:0 12px} .search button{width:44px} main{padding:56px 16px 40px}
  .grid{grid-template-columns:1fr;gap:28px}
  .rc{grid-template-columns:150px minmax(0,1fr)}
  .right .hide-s{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></symbol>
  <symbol id="i-long" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M10 9.2v5.6l4.6-2.8z"/></symbol>

  <symbol id="i-hist" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5M3.5 3.5v5h5M12 7.5V12l3 2"/></symbol>

  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
</svg>

<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="菜单"><svg class="i"><use href="#i-menu"/></svg></button>
  <a class="logo" href="#/" aria-label="首页"><span class="mark"></span><span class="word">HN<b>Picks</b></span></a>
  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="搜索" autocomplete="off" aria-label="搜索">
    <button aria-label="搜索"><svg class="i"><use href="#i-search"/></svg></button>
  </form>
  <div class="right">
    <button class="iconbtn hide-s" id="helpBtn" aria-label="帮助"><svg class="i"><use href="#i-help"/></svg></button>
    <button class="iconbtn" id="themeBtn" aria-label="切换深色模式"><svg class="i"><use href="#i-moon"/></svg></button>
  </div>
</header>

<nav class="side" id="side">
  <a href="#/" data-r="home"><svg class="i"><use href="#i-home"/></svg>首页</a>
  <a href="#/longs" data-r="longs"><svg class="i"><use href="#i-long"/></svg>长视频</a>
  <a href="#/recent" data-r="recent"><svg class="i"><use href="#i-trend"/></svg>最近被推荐</a>
  <hr>
  <a href="#/liked" data-r="liked"><svg class="i"><use href="#i-like"/></svg>赞过</a>
  <a href="#/history" data-r="history"><svg class="i"><use href="#i-hist"/></svg>历史</a>
  <a href="#/later" data-r="later"><svg class="i"><use href="#i-later"/></svg>稍后观看</a>

<div class="scrim" id="scrim" hidden></div>

<main id="view"><div class="empty">加载中…</div></main>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = n => `<svg class="i"><use href="#i-${n}"/></svg>`;

/* ---------------- 本地状态（只存在浏览器里） ---------------- */
const KEY = 'hnpicks.v2';
const S = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })();
S.liked ||= {}; S.later ||= {}; S.history ||= {};
S.theme ||= 'auto'; S.lang ||= 'zh'; if (S.hideWatched === undefined) S.hideWatched = true;
S.f ||= {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const applyTheme = () => { if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = S.theme; };
applyTheme();

/* ---------------- 数据 ---------------- */
let DATA = [], BY = new Map(), META = {}, STATUS = {}, HAS_DUR = false, HAS_PUB = false;
const shardCache = new Map();
const shard = n => {
  if (!shardCache.has(n)) shardCache.set(n, fetch(`d/${String(n).padStart(2,'0')}.json`, {cache:'no-cache'}).then(r => r.json()).catch(() => ({})));
  return shardCache.get(n);
};
const now = () => Date.now() / 1000;

/* ---------------- 格式化 ---------------- */
const fmtDur = s => { if (!s) return ''; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(s%60).padStart(2,'0'); return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; };
const fmtViews = v => v == null ? '' : v < 1e4 ? `${v}次观看` : v < 1e8 ? `${+(v/1e4).toFixed(v<1e5?1:0)}万次观看` : `${+(v/1e8).toFixed(1)}亿次观看`;
const fmtAgo = ts => { if (!ts) return ''; const d = (now()-ts)/86400; if (d < 1) return '今天'; if (d < 30) return `${Math.floor(d)}天前`; if (d < 365) return `${Math.floor(d/30)}个月前`; return `${Math.floor(d/365)}年前`; };
const ym = ts => { const d = new Date(ts*1000); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}`; };
const title = it => (S.lang === 'zh' && it.tz) ? it.tz : (it.t || it.tz || (it.kd === 'x' ? (it.tx || 'X 帖子').slice(0,60) : '（标题未获取）'));
const altTitle = it => (S.lang === 'zh' && it.tz && it.t && it.t !== it.tz) ? it.t : (S.lang !== 'zh' && it.tz && it.tz !== it.t ? it.tz : '');
const chan = it => it.ch || (it.h ? '@' + it.h : (it.kd === 'x' ? 'X' : ''));
const thumb = it => `https://i.ytimg.com/vi/${it.id}/hq2.jpg`;     // 视频中段的代表帧
const thumbFallback = it => `https://i.ytimg.com/vi/${it.id}/hqdefault.jpg`;
const url = it => it.kd === 'y' ? `https://www.youtube.com/watch?v=${it.id}` : `https://x.com/${it.h || 'i'}/status/${it.id}`;
const metaLine = it => [fmtViews(it.v), fmtAgo(it.p)].filter(Boolean).join(' • ');

/* ---------------- 「为你推荐」排序 ---------------- */
function prefs(){
  const w = {c:{}, t:{}, ch:{}};
  const add = (k, x) => { const it = BY.get(k); if (!it) return; w.c[it.c] = (w.c[it.c]||0)+x; (it.tp||[]).forEach(t => w.t[t] = (w.t[t]||0)+x); if (it.ch) w.ch[it.ch] = (w.ch[it.ch]||0)+x; };
  Object.keys(S.liked).forEach(k => add(k, 3));
  Object.keys(S.later).forEach(k => add(k, 1));
  Object.keys(S.history).forEach(k => add(k, 1));
  return w;
}
function rand(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; }
function forYou(list){
  const w = prefs(), day = new Date().toISOString().slice(0,10);
  const scored = list.map(it => {
    const aff = 0.5*Math.log1p(w.c[it.c]||0) + 0.7*Math.log1p((it.tp||[]).reduce((a,t) => a + (w.t[t]||0), 0)) + 0.8*Math.log1p(w.ch[it.ch]||0);
    return [it, Math.log1p(it.na) + 0.35*Math.log1p(it.nm) + aff + 0.9*rand(day + it.k)];
  }).sort((a,b) => b[1]-a[1]).map(x => x[0]);
  // 同一频道在前面不扎堆：每个频道先出现最多 2 次，多的往后放
  const seen = {}, head = [], tail = [];
  for (const it of scored) { const c = it.ch || it.k; seen[c] = (seen[c]||0)+1; (seen[c] <= 2 ? head : tail).push(it); }
  return head.concat(tail);
}

const F = {
  up:   {label:'上传时间', opts:[['any','不限'],['1y','一年内'],['5y','五年内'],['10y','十年内'],['old','十年以前']]},
  dur:  {label:'时长', opts:[['any','不限'],['s','4 分钟以内'],['m','4–20 分钟'],['l','20 分钟以上']]},
  kind: {label:'类型', opts:[['any','全部'],['y','视频'],['x','X 帖子']]},
  rec:  {label:'推荐人数', opts:[['any','不限'],['10','10 人以上'],['30','30 人以上'],['multi','多个社区都推荐']]},
  src:  {label:'来源社区', opts:[['any','全部'],['0','Hacker News'],['1','Lobsters'],['2','Reddit']]},
  sort: {label:'排序依据', opts:[['foryou','为你推荐'],['most','推荐人数最多'],['span','推荐时间跨度最长'],['recent','最近被推荐'],['new','上传日期'],['views','播放量']]},
};
const fv = k => S.f[k] || F[k].opts[0][0];
function applyFilters(list, {skipSort} = {}){
  const t = now(), up = fv('up'), dur = fv('dur'), kind = fv('kind'), rec = +fv('rec') || 0, multi = fv('rec') === 'multi', src = fv('src');
  let out = list.filter(it => {
    if (kind !== 'any' && it.kd !== kind) return false;
    if (rec && it.na < rec) return false;
    const sc = it.sc || [it.na, 0, 0];
    if (multi && sc.filter(Boolean).length < 2) return false;
    if (src !== 'any' && !sc[+src]) return false;
    if (up !== 'any' && HAS_PUB) {
      if (!it.p) return false;
      const age = (t - it.p) / 31557600;
      if (up === '1y' && age > 1 || up === '5y' && age > 5 || up === '10y' && age > 10 || up === 'old' && age <= 10) return false;
    }
    if (dur !== 'any' && HAS_DUR) {
      if (!it.d) return false;
      if (dur === 's' && it.d >= 240 || dur === 'm' && (it.d < 240 || it.d > 1200) || dur === 'l' && it.d <= 1200) return false;
    }
    return true;
  });
  return skipSort ? out : sortBy(out, fv('sort'));
}
function sortBy(list, how){
  const by = {
    most: (a,b) => b.na - a.na || b.s - a.s,
    span: (a,b) => (b.l-b.f) - (a.l-a.f),
    recent: (a,b) => b.l - a.l,
    new: (a,b) => (b.p||0) - (a.p||0),
    views: (a,b) => (b.v||0) - (a.v||0),
  }[how];
  return by ? list.slice().sort(by) : forYou(list);
}

}

/* ---------------- 无限滚动列表 ---------------- */
let io;
function mountList(container, list, {compact = false, page = 36} = {}){
  let n = 0;
  if (io) io.disconnect();
  const sentinel = document.createElement('div'); sentinel.className = 'sentinel';
  const more = () => { container.insertAdjacentHTML('beforeend', list.slice(n, n + page).map(it => card(it, compact)).join('')); n += page; if (n >= list.length) io.disconnect(); };
  io = new IntersectionObserver(es => es.some(e => e.isIntersecting) && more(), {rootMargin: '1200px'});
  container.after(sentinel); more(); io.observe(sentinel);
}

      ((it.tp||[]).length || it.c ? `<div class="tags">${[`<a href="#/c/${encodeURIComponent(it.c)}">${esc(it.c)}</a>`, ...(it.tp||[]).map(t => `<a href="#/t/${encodeURIComponent(t)}">#${esc(t)}</a>`)].join('')}</div>` : ''));
    const qs = d.q || [];
    $('#quotes').innerHTML = qs.length ? `<h3>大家怎么说 · ${d.nmn || qs.length} 次提及</h3>` + qs.map(q => `<div class="qt">
        <div class="av" style="background:hsl(${hue(q.author)} 55% 45%)">${esc(q.author[0].toUpperCase())}</div>
        <div><div class="who"><a href="${userUrl(q)}" target="_blank" rel="noopener">${esc(q.author)}</a><span class="sb">${srcName(q.src || 'hn')}</span><span><a href="${quoteUrl(q)}" target="_blank" rel="noopener">${ym(q.ts)}${q.story_title ? ' · ' + esc(q.story_title) : ''}</a></span></div>
        <p>${esc(q.text)}</p></div></div>`).join('') : '';
  },
};
function savedPage(name, key, emptyText){
  const list = Object.entries(S[key]).sort((a,b) => b[1]-a[1]).map(([k]) => BY.get(k)).filter(Boolean);
  V.innerHTML = `<div class="pagehead"><h2>${name}</h2><span>${list.length} 个</span>${list.length ? `<button class="ghost" id="clearList">清空</button>` : ''}</div>
    ${list.length ? '<div class="grid" id="grid"></div>' : `<div class="empty">${emptyText}</div>`}`;
  if (list.length) {
    mountList($('#grid'), list);
    $('#clearList').onclick = () => { if (confirm(`清空「${name}」？`)) { S[key] = {}; save(); route(); } };
  }
}

/* ---------------- 路由 ---------------- */
function route(){
  const [, r = '', arg = ''] = location.hash.match(/^#\/([^/]*)\/?(.*)$/) || [];
  const name = r || 'home', a = decodeURIComponent(arg);
  document.querySelectorAll('.side a').forEach(x => x.classList.toggle('on', x.dataset.r === name));
  document.body.classList.toggle('collapsed', name === 'watch' && innerWidth > 1100 && !document.body.classList.contains('pinned'));
  closeDrawer();
  if (io) io.disconnect();
  document.querySelectorAll('.sentinel').forEach(x => x.remove());
  (pages[name] || pages.home)(a);
  if (name !== 'watch') document.title = $('title').dataset.base;
}
const closeDrawer = () => { document.body.classList.remove('drawer'); $('#scrim').hidden = true; };
$('#menuBtn').onclick = () => {
  if (innerWidth > 1100) { document.body.classList.toggle('collapsed'); document.body.classList.toggle('pinned', !document.body.classList.contains('collapsed')); }
  else { document.body.classList.add('drawer'); $('#scrim').hidden = false; }
};
$('#scrim').onclick = closeDrawer;
$('#searchForm').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); location.hash = q ? `#/search/${encodeURIComponent(q)}` : '#/'; };
$('#themeBtn').onclick = () => { const dark = matchMedia('(prefers-color-scheme: dark)').matches; const cur = S.theme === 'auto' ? (dark ? 'dark' : 'light') : S.theme; S.theme = cur === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
function showHelp(){
  const m = $('#help');
  m.innerHTML = `<div class="box"><h2>这是什么？</h2>
    <p>我们读遍了 Hacker News、Lobsters、Reddit 多年来的讨论（只用各站官方接口），只留下被 <b>≥${META.min_authors} 位不同用户</b>、在 <b>≥${META.min_months} 个不同月份</b>反复推荐过的视频。经得起时间检验的东西，不用再赌推荐算法。</p>
    <p>作者给自己视频打广告、低赞帖子、机器人账号都不算推荐。被多个社区独立推荐的视频排名更靠前。</p>
    <p>不用登录。「为你推荐」会根据你赞过、看过、想看的视频调整排序，这些偏好只保存在你的浏览器里。封面用的是视频中段的画面，而不是精心设计的点击诱饵。</p>
    <p>数据由服务器上的 Agent 自动抓取、筛选、分类，每 ${STATUS.interval_hours || 6} 小时更新一次。</p>
    <h2 style="font-size:16px;margin-top:18px">快捷键</h2>
    <table><tr><td><kbd>/</kbd></td><td>搜索</td></tr><tr><td><kbd>t</kbd></td><td>切换深色模式</td></tr>
    <tr><td><kbd>l</kbd></td><td>赞（视频页）</td></tr><tr><td><kbd>w</kbd></td><td>稍后观看（视频页）</td></tr>
    <tr><td><kbd>Esc</kbd></td><td>关闭 / 返回</td></tr><tr><td><kbd>?</kbd></td><td>显示本帮助</td></tr></table>
    <p style="text-align:right;margin-top:16px"><button class="pill" id="closeHelp">知道了</button></p></div>`;
  m.hidden = false;
  $('#closeHelp').onclick = () => m.hidden = true;
}
$('#help').onclick = e => { if (e.target.id === 'help') e.target.hidden = true; };
$('#helpBtn').onclick = showHelp;
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 't') $('#themeBtn').click();
  else if (e.key === '?') showHelp();
  else if (e.key === 'l') $('#likeBtn')?.click();
  else if (e.key === 'w') $('#laterBtn')?.click();
  else if (e.key === 'Escape') { if (!$('#help').hidden) $('#help').hidden = true; else if (location.hash.startsWith('#/watch/')) history.back(); }
});
window.addEventListener('hashchange', route);

/* ---------------- 启动 ---------------- */
$('title').dataset.base = document.title;
Promise.all([
  fetch('data.json', {cache:'no-cache'}).then(r => r.json()),
  fetch('status.json', {cache:'no-cache'}).then(r => r.json()).catch(() => ({})),
]).then(([data, st]) => {
  META = data; STATUS = st;
  DATA = data.items.map(it => ({...it, _s: [it.t, it.tz, it.ch, it.c, it.h, it.tx, ...(it.tp||[])].join(' ').toLowerCase()}));
  DATA.forEach(it => BY.set(it.k, it));
  HAS_DUR = DATA.some(it => it.d); HAS_PUB = DATA.some(it => it.p);
  $('#sideNote').innerHTML = `${DATA.length.toLocaleString()} 个被反复推荐的视频<br>数据更新于 ${st.updated_at ? fmtAgo(st.updated_at).replace('今天', '今天') : '—'}<br><a href="javascript:void 0" id="sideHelp" style="text-decoration:underline">这是什么？</a>`;
  $('#sideHelp').onclick = showHelp;
  route();
  try { if (!localStorage.getItem('hnpicks.helped')) { showHelp(); localStorage.setItem('hnpicks.helped', '1'); } } catch {}
}).catch(err => { V.innerHTML = `<div class="empty">数据加载失败：${esc(err)}</div>`; });
})();
</script>
</body>
</html>
